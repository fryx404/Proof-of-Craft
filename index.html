<!-- テーマをCSS適用前に確定させ、リロード時の一瞬のちらつきを防ぐ -->
<script>
(function () {
  try {
    var saved = localStorage.getItem('poc-theme') || 'system';
    var dark = saved === 'dark' ||
      (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) { /* localStorage不可の環境では light のまま */ }
})();
</script>

<!-- テーマ管理: 3モード + localStorage永続化 + OS設定への追従 -->
<script>
(function () {
  var KEY = 'poc-theme';
  var mq = matchMedia('(prefers-color-scheme: dark)');
  var btns = document.querySelectorAll('[data-theme-set]');

  function read() { try { return localStorage.getItem(KEY) || 'system'; } catch (e) { return 'system'; } }

  function apply() {
    var pref = read();
    var dark = pref === 'dark' || (pref === 'system' && mq.matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    btns.forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.themeSet === pref));
    });
  }

  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      try { localStorage.setItem(KEY, b.dataset.themeSet); } catch (e) {}
      apply();
    });
  });

  mq.addEventListener('change', apply);   // system選択中はOS設定に追従
  apply();
})();
</script>
